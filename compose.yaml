services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: SQL_Server
    ports:
      - 1434:1433
    environment:
      - MSSQL_SA_PASSWORD=Mariguapo..10
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
    
    volumes:
      - sql_server_data:/var/opt/mssql
  storeapi:
    image: storeapi
    build:
      context: .
      dockerfile: StoreAPI/Dockerfile

  storeapi.models:
    image: storeapi.models
    build:
      context: .
      dockerfile: StoreAPI.Models/Dockerfile
volumes:
  sql_server_data: